---

- name: '/etc/apt/keyrings directory created'
  file:
    path: '/etc/apt/keyrings'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: 'Caddy GPG key added'
  get_url:
    url: 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key'
    dest: '/etc/apt/keyrings/caddy-stable.asc'
    mode: '0644'

- name: 'Caddy repository added'
  apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main'
    state: 'present'
    filename: 'caddy-stable'
    update_cache: 'true'
  # Refreshing the package lists needs the APT lock
  register: 'apt_status'
  until: 'apt_status is success'
  delay: 10
  retries: 60

- name: 'Caddy package installed'
  apt:
    name:
      - 'caddy'
    state: 'present'
  # This stuff waits for APT/dpkg lock if unattended upgrades are running
  register: 'apt_status'
  until: 'apt_status is success'
  delay: 10
  retries: 60

# The floating IP is not on any local interface, because the instance sits
# behind NAT, so the only place to learn it is the OpenStack metadata service.
# Exosphere attaches the floating IP after Nova reports the server active,
# which can be after this play has started, so keep asking for a few minutes
# before concluding there is none. A cloud without floating IPs answers with
# something other than 200, or with an empty body, for the whole window.
- name: 'Floating IPv4 address queried from the OpenStack metadata service'
  uri:
    url: 'http://169.254.169.254/latest/meta-data/public-ipv4'
    return_content: true
    timeout: 10
  register: 'caddy_metadata_public_ipv4'
  until: '((caddy_metadata_public_ipv4.status | default(0)) == 200) and ((caddy_metadata_public_ipv4.content | default("") | trim) is regex("^[0-9]{1,3}(\.[0-9]{1,3}){3}$"))'
  delay: 10
  retries: 18
  failed_when: false
  changed_when: false

- name: 'Floating IPv4 address fact set'
  set_fact:
    caddy_floating_ipv4: '{{ (caddy_metadata_public_ipv4.content | default("") | trim | regex_search("^[0-9]{1,3}(?:\.[0-9]{1,3}){3}$") | default("", true)) if ((caddy_metadata_public_ipv4.status | default(0)) == 200) else "" }}'

# Global IPv6 addresses are routed rather than NAT'd, so they are on the
# interface and Ansible has already gathered them. Keep only global unicast,
# 2000::/3, which after lowercasing is a first hex digit of 2 or 3. This is
# the same rule as Helpers.Cidr.isGlobalUnicastIPv6 on the Exosphere side;
# the two must agree or the browser can pick an address with no certificate.
# Caddy gets a site (and a certificate) for every address that passes, so it
# does not matter which one Exosphere picks.
- name: 'Globally routable IPv6 addresses fact set'
  set_fact:
    caddy_global_ipv6_list: '{{ ansible_all_ipv6_addresses | default([]) | map("lower") | select("match", "^[23]") | list }}'

- name: 'Routable address checked before configuring Caddy'
  fail:
    msg: 'Direct Guacamole access over TLS needs either a floating IPv4 address or a globally routable IPv6 address on this instance, and neither was found after waiting. Attach a floating IP, or use the user application proxy instead of setting guac_tls_enabled.'
  when: '(caddy_floating_ipv4 | length == 0) and (caddy_global_ipv6_list | length == 0)'

- name: 'Caddyfile templated'
  template:
    src: 'Caddyfile.j2'
    dest: '/etc/caddy/Caddyfile'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: 'Caddy restarted'

- name: 'Caddy service enabled and started'
  systemd:
    name: 'caddy'
    enabled: true
    state: 'started'

# Apply the templated configuration now rather than at the end of the play,
# so the package's default Caddyfile never serves for longer than a moment.
- name: 'Configuration changes applied'
  meta: 'flush_handlers'
