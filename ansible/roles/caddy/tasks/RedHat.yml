---

# Caddy's own COPR rather than EPEL. EPEL 9 still ships Caddy 2.6, which has neither the ACME
# shortlived profile nor certificates for IP addresses, and both are what makes this work.
- name: 'Caddy repository added'
  yum_repository:
    name: 'group_caddy-caddy'
    description: 'Caddy'
    baseurl: 'https://download.copr.fedorainfracloud.org/results/@caddy/caddy/epel-{{ ansible_distribution_major_version }}-$basearch/'
    gpgkey: 'https://download.copr.fedorainfracloud.org/results/@caddy/caddy/pubkey.gpg'
    gpgcheck: true

- name: 'Caddy package installed'
  dnf:
    name:
      - 'caddy'
      # semanage, for the SELinux relabelling below. Already on the Jetstream2 images.
      - 'policycoreutils-python-utils'
    state: 'present'

# The targeted policy labels /usr/bin/caddy as httpd_exec_t, so systemd runs Caddy as httpd_t.
# In that domain Caddy accepts connections on 443 and is then denied reading them, and is denied
# its own admin socket, so it serves nothing and cannot reload. Nothing in this play talks to
# Caddy over the network, so the deployment looks fine while every connection is reset. Run it
# unconfined instead, which is the footing it has on Ubuntu.
- name: 'Caddy binary labelled for an unconfined domain'
  command: 'semanage fcontext -a -t bin_t /usr/bin/caddy'
  # semanage says 'already defined, modifying instead' and exits 0 on a rerun.
  changed_when: false
  when: "ansible_selinux.status | default('disabled') == 'enabled'"

- name: 'Caddy binary relabelled'
  command: 'restorecon -v /usr/bin/caddy'
  register: 'caddy_restorecon'
  changed_when: "'Relabeled' in caddy_restorecon.stdout"
  when: "ansible_selinux.status | default('disabled') == 'enabled'"

# Rocky images run firewalld, which drops 443 before the instance's security group is ever
# consulted. Only ansible-core is installed on the instance, so there is no firewalld module.
- name: 'firewalld checked'
  command: 'systemctl is-active firewalld'
  register: 'caddy_firewalld'
  changed_when: false
  failed_when: false

- name: '443/tcp opened in firewalld'
  command: '{{ item }}'
  loop:
    - 'firewall-cmd --permanent --add-port=443/tcp'
    - 'firewall-cmd --reload'
  when: 'caddy_firewalld.rc == 0'
